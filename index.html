<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>헬로CN닥스 - 실시간 웹 엑셀</title>

  <!-- Luckysheet UI 라이브러리 -->
  <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/plugins/css/pluginsCss.css' />
  <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/plugins/plugins.css' />
  <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/css/luckysheet.css' />
  <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/assets/iconfont/iconfont.css' />
  <script src="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/plugins/js/plugin.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/luckysheet.umd.js"></script>

  <style>
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; overflow: hidden; }
    
    .screen { display: none; width: 100%; height: 100%; flex-direction: column; }
    .screen.active { display: flex; }

    /* 로그인 화면 */
    #login-screen { justify-content: center; align-items: center; background: #f0f2f5; }
    .login-box { background: #ffffff; padding: 48px 40px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.08); width: 440px; text-align: center; box-sizing: border-box; }
    .login-logo { width: 50px; height: 50px; background: #1a73e8; color: white; border-radius: 12px; display: inline-flex; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; margin-bottom: 20px; }
    .login-box h2 { margin: 0 0 30px 0; color: #202124; font-size: 24px; font-weight: 700; }
    
    .id-wrapper { display: flex; align-items: stretch; border: 1px solid #dadce0; border-radius: 8px; overflow: hidden; background: #fff; margin-bottom: 16px; transition: border 0.2s; }
    .id-wrapper:focus-within { border: 1px solid #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,0.2); }
    .id-wrapper input { border: none; padding: 14px 16px; flex: 1; outline: none; font-size: 15px; color: #202124; min-width: 0; }
    .id-wrapper span { padding: 0 16px; color: #5f6368; font-size: 14px; background: #f8f9fa; border-left: 1px solid #dadce0; display: flex; align-items: center; font-weight: 500; white-space: nowrap; }
    
    .pw-input { width: 100%; padding: 14px 16px; border: 1px solid #dadce0; border-radius: 8px; box-sizing: border-box; font-size: 15px; margin-bottom: 24px; transition: 0.2s; }
    .pw-input:focus { border: 1px solid #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,0.2); outline: none; }
    
    button.primary-btn { width: 100%; padding: 14px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 4px rgba(26,115,232,0.3); }
    button.primary-btn:hover { background: #1557b0; box-shadow: 0 4px 8px rgba(26,115,232,0.4); }

    /* 헤더바 */
    .header-bar { height: 64px; min-height: 64px; background: #ffffff; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; z-index: 10; box-shadow: 0 1px 4px rgba(0,0,0,0.08); flex-shrink: 0; }
    .header-left { display: flex; align-items: center; gap: 20px; }
    .header-title { font-size: 18px; font-weight: 800; color: #1a73e8; margin-right: 10px; }
    .header-info { font-size: 14px; font-weight: 600; color: #3c4043; background: #f1f3f4; padding: 6px 12px; border-radius: 6px; }
    
    .db-status { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #34a853; background: #e6f4ea; padding: 6px 12px; border-radius: 20px; }
    .status-dot { width: 8px; height: 8px; background-color: #34a853; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(52, 168, 83, 0.6); } 70% { box-shadow: 0 0 0 6px rgba(52, 168, 83, 0); } 100% { box-shadow: 0 0 0 0; } }
    .db-status.saving .status-dot { background-color: #fbbc04; animation: pulse-yellow 1s infinite; }
    .db-status.saving { color: #b08d00; background: #fef7e0; }
    @keyframes pulse-yellow { 0% { box-shadow: 0 0 0 0 rgba(251, 188, 4, 0.6); } 70% { box-shadow: 0 0 0 6px rgba(251, 188, 4, 0); } 100% { box-shadow: 0 0 0 0; } }

    #concurrent-users { display: none; background: #e8f0fe; color: #1a73e8; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; border: 1px solid #d2e3fc; }
    
    .header-actions button { padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; margin-left: 10px; transition: 0.2s; }
    #btn-show-admin { background: #34a853; color: white; }
    #btn-show-admin:hover { background: #2d9047; }
    #btn-logout { background: #fff; color: #5f6368; border: 1px solid #dadce0; }
    #btn-logout:hover { background: #f8f9fa; color: #202124; }

    /* 엑셀 컨테이너 */
    #spreadsheet-container { flex: 1; width: 100vw; position: relative; height: calc(100vh - 64px); background: #fff; }
    #luckysheet { margin: 0; padding: 0; position: absolute; width: 100%; height: 100%; left: 0; top: 0; }

    #loading-mask { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #1a73e8; font-weight: bold; font-size: 16px; }
    .spinner { width: 40px; height: 40px; border: 4px solid #e0e0e0; border-top: 4px solid #1a73e8; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* 관리자 패널 팝업 */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(2px); }
    .modal-content { background: white; padding: 0; border-radius: 12px; width: 550px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,0.2); overflow: hidden; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; background: #f8f9fa; border-bottom: 1px solid #eee; }
    .modal-header h3 { margin: 0; font-size: 18px; color: #202124; }
    .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #5f6368; padding: 0; }
    
    .admin-tabs { display: flex; border-bottom: 1px solid #ddd; background: #fff; }
    .admin-tab { flex: 1; text-align: center; padding: 12px 0; font-weight: 600; cursor: pointer; color: #5f6368; border-bottom: 2px solid transparent; transition: 0.2s; }
    .admin-tab.active { color: #1a73e8; border-bottom: 2px solid #1a73e8; }
    
    .admin-body { padding: 24px; overflow-y: auto; flex: 1; }
    .admin-section { display: none; }
    .admin-section.active { display: block; }
    
    .admin-body label { display: block; font-size: 13px; color: #5f6368; font-weight: 600; margin-bottom: 6px; }
    .admin-body input:not(#new-id), .admin-body select { width: 100%; padding: 12px; margin-bottom: 16px; border: 1px solid #dadce0; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
    
    /* 사용자 목록 테이블 */
    .user-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    .user-table th, .user-table td { padding: 10px; border-bottom: 1px solid #eee; }
    .user-table th { background: #f8f9fa; color: #5f6368; font-weight: 600; }
    .btn-reset { padding: 4px 8px; background: #ea4335; color: white; border: none; border-radius: 4px; font-size: 11px; cursor: pointer; }
    .btn-reset:hover { background: #c5221f; }
  </style>
</head>
<body>

<!-- 로그인 -->
<div id="login-screen" class="screen active">
  <div class="login-box">
    <div class="login-logo">N</div>
    <h2>헬로CN닥스</h2>
    <div class="id-wrapper">
      <input type="text" id="login-id" placeholder="아이디 (예: suby20)">
      <span>@helloconnectn.com</span>
    </div>
    <input type="password" id="login-pw" class="pw-input" placeholder="비밀번호">
    <button id="btn-login" class="primary-btn">시스템 접속</button>
  </div>
</div>

<!-- 메인 -->
<div id="main-screen" class="screen">
  <div class="header-bar">
    <div class="header-left">
      <div class="header-title">헬로CN닥스</div>
      <div class="header-info" id="user-info-display">로딩중...</div>
      <div id="db-status-indicator" class="db-status">
        <span class="status-dot"></span>
        <span id="db-status-text">DB 연결 준비중</span>
      </div>
      <div id="concurrent-users">동시 편집 감지됨: </div>
    </div>
    <div class="header-actions">
      <button id="btn-show-admin" style="display: none;">관리자 패널</button>
      <button id="btn-logout">로그아웃</button>
    </div>
  </div>
  <div id="spreadsheet-container">
    <div id="loading-mask">
      <div class="spinner"></div>
      <div id="loading-text">엑셀 데이터를 실시간으로 불러오는 중입니다...</div>
    </div>
    <div id="luckysheet"></div>
  </div>
</div>

<!-- 관리자 모달 -->
<div id="admin-modal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h3>시스템 관리 (Admin)</h3>
      <button id="btn-close-admin" class="close-btn">&times;</button>
    </div>
    <div class="admin-tabs">
      <div class="admin-tab active" data-target="tab-create">신규 계정 발급</div>
      <div class="admin-tab" data-target="tab-users">사용자 목록 / 관리</div>
    </div>
    <div class="admin-body">
      <!-- 탭 1: 발급 -->
      <div id="tab-create" class="admin-section active">
        <label>아이디</label>
        <div class="id-wrapper" style="margin-bottom: 16px;">
          <input type="text" id="new-id" placeholder="사번 입력" style="margin:0; border:none; padding:14px 16px;">
          <span>@helloconnectn.com</span>
        </div>
        <label>성명</label><input type="text" id="new-name" placeholder="예: 홍길동">
        <label>부서명</label><input type="text" id="new-dept" placeholder="예: 부평센터">
        <label>권한</label>
        <select id="new-role">
          <option value="user">일반 사용자</option>
          <option value="admin">관리자</option>
        </select>
        <label>초기 비밀번호</label><input type="password" id="new-pw" placeholder="6자리 이상">
        <button id="btn-create-user" class="primary-btn">계정 생성 및 등록</button>
      </div>
      <!-- 탭 2: 목록 -->
      <div id="tab-users" class="admin-section">
        <div id="user-list-container">사용자 정보를 불러오는 중입니다...</div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, getDocs, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyALzPfEZrPFtS9JTtqWs6blOolUElOWgBI",
    authDomain: "hellocn-128ba.firebaseapp.com",
    projectId: "hellocn-128ba",
    storageBucket: "hellocn-128ba.firebasestorage.app",
    messagingSenderId: "306539866159",
    appId: "1:306539866159:web:164b7242c1d9f6e0233eda",
    measurementId: "G-ETFMQX75CB"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const secondaryApp = initializeApp(firebaseConfig, "SecondaryApp");
  const secondaryAuth = getAuth(secondaryApp);
  const domain = "@helloconnectn.com";

  let currentUserInfo = null;
  let saveTimeout;
  let isInitializing = true;
  let localLastSaveTime = 0; // 양방향 동기화 구분을 위한 로컬 타임스탬프

  const dbStatusIndicator = document.getElementById('db-status-indicator');
  const dbStatusText = document.getElementById('db-status-text');

  // 기본 시트(가볍게 설정하여 로딩 최적화)
  function getDefaultData() {
    const centers = ['통합대시보드', '부평센터', '계양센터', '해운대센터', '서부센터', '양산센터', '대구동구센터', '경주센터', '양천센터', '나라센터', '강릉센터', '속초센터'];
    return centers.map((center, index) => ({
      name: center, status: index === 0 ? 1 : 0, order: index, row: 50, column: 20, celldata: []
    }));
  }

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      const userDoc = await getDoc(doc(db, "users", user.uid));
      currentUserInfo = userDoc.exists() ? { ...userDoc.data(), uid: user.uid } : { name: "알수없음", dept: "소속없음", role: "user", uid: user.uid };
      
      document.getElementById('user-info-display').innerText = `${currentUserInfo.name} (${currentUserInfo.dept})`;
      document.getElementById('login-screen').classList.remove('active');
      document.getElementById('main-screen').classList.add('active');
      
      // 관리자 권한 제어
      if (currentUserInfo.role === 'admin') {
        document.getElementById('btn-show-admin').style.display = 'inline-block';
      }
      
      // 실시간 데이터 수신 리스너 등록 (양방향 동기화 핵심)
      listenForDataChanges();
      listenPresence();
    } else {
      document.getElementById('login-screen').classList.add('active');
      document.getElementById('main-screen').classList.remove('active');
      currentUserInfo = null;
    }
  });

  document.getElementById('btn-login').addEventListener('click', () => {
    const id = document.getElementById('login-id').value.trim();
    const pw = document.getElementById('login-pw').value;
    if (!id || !pw) return alert("입력값을 확인하세요.");
    signInWithEmailAndPassword(auth, id + domain, pw).catch(err => alert("로그인 실패: " + err.message));
  });

  document.getElementById('btn-logout').addEventListener('click', async () => {
    try { await signOut(auth); window.location.reload(); } catch(err) {}
  });

  // 관리자 모달 및 탭 제어
  document.getElementById('btn-show-admin').addEventListener('click', () => {
    document.getElementById('admin-modal').style.display = 'flex';
    loadUserList(); // 모달 열릴 때 사용자 목록 불러오기
  });
  document.getElementById('btn-close-admin').addEventListener('click', () => document.getElementById('admin-modal').style.display = 'none');
  
  document.querySelectorAll('.admin-tab').forEach(tab => {
    tab.addEventListener('click', (e) => {
      document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
      e.target.classList.add('active');
      document.getElementById(e.target.dataset.target).classList.add('active');
    });
  });

  // 관리자 - 사용자 목록 불러오기
  async function loadUserList() {
    const container = document.getElementById('user-list-container');
    container.innerHTML = "데이터를 불러오는 중...";
    try {
      const snapshot = await getDocs(collection(db, "users"));
      let html = `<table class="user-table">
                    <thead><tr><th>이름</th><th>부서</th><th>권한</th><th>관리</th></tr></thead><tbody>`;
      snapshot.forEach(docSnap => {
        const u = docSnap.data();
        html += `<tr>
                   <td>${u.name}</td>
                   <td>${u.dept}</td>
                   <td>${u.role === 'admin' ? '관리자' : '사용자'}</td>
                   <td><button class="btn-reset" onclick="window.resetUserPassword('${u.email}')">PW 초기화</button></td>
                 </tr>`;
      });
      html += `</tbody></table>`;
      container.innerHTML = html;
    } catch (err) {
      container.innerHTML = "목록을 불러오지 못했습니다.";
    }
  }

  // 관리자 - 비밀번호 초기화 (이메일 발송)
  window.resetUserPassword = async (email) => {
    if(confirm(`${email} 계정의 비밀번호 초기화 메일을 발송하시겠습니까?\n(보안 정책상 관리자가 임의로 비밀번호를 지정할 수 없으며, 사용자가 메일을 통해 재설정해야 합니다.)`)) {
      try {
        await sendPasswordResetEmail(auth, email);
        alert("초기화 이메일이 발송되었습니다.");
      } catch (err) {
        alert("이메일 발송 실패: " + err.message);
      }
    }
  };

  document.getElementById('btn-create-user').addEventListener('click', async () => {
    const id = document.getElementById('new-id').value.trim();
    const pw = document.getElementById('new-pw').value;
    const name = document.getElementById('new-name').value.trim();
    const dept = document.getElementById('new-dept').value.trim();
    const role = document.getElementById('new-role').value;

    if (!id || !pw || !name || !dept) return alert("모든 항목을 입력하세요.");
    try {
      const userCred = await createUserWithEmailAndPassword(secondaryAuth, id + domain, pw);
      await setDoc(doc(db, "users", userCred.user.uid), { name, dept, role, email: id + domain });
      await signOut(secondaryAuth);
      alert(`[${name}] 계정 발급 완료`);
      loadUserList(); // 생성 후 목록 갱신
      ['new-id', 'new-name', 'new-dept', 'new-pw'].forEach(el => document.getElementById(el).value = '');
    } catch (error) {
      alert("발급 에러: " + error.message);
    }
  });

  // ★ 양방향 실시간 동기화 리스너 (다른 사람이 수정 시 내 화면 업데이트)
  function listenForDataChanges() {
    onSnapshot(doc(db, "sheets", "master_doc"), (docSnap) => {
      if (docSnap.exists()) {
        const remoteData = docSnap.data();
        // 내가 마지막으로 저장한 시간보다 서버 데이터가 2초 이상 최신일 경우 (다른 사람이 수정한 경우)
        if (remoteData.timestamp > localLastSaveTime + 2000) {
          try {
            const parsedData = JSON.parse(remoteData.content);
            renderLuckysheet(parsedData);
          } catch(e) {
            renderLuckysheet(getDefaultData());
          }
        }
      } else {
        renderLuckysheet(getDefaultData());
      }
    });
  }

  // 엑셀 화면 렌더링 (한국어 패치 완벽 적용)
  function renderLuckysheet(sheetData) {
    isInitializing = true;
    document.getElementById('loading-mask').style.display = 'flex';
    document.getElementById('loading-text').innerText = "최신 데이터를 동기화 중입니다...";
    
    // 한국어 UI 버그 패치 로직
    try {
      if (window.luckysheet && window.luckysheet.locales && window.luckysheet.locales.en) {
        if(!window.luckysheet.locales.ko) window.luckysheet.locales.ko = {};
        Object.assign(window.luckysheet.locales.ko, window.luckysheet.locales.en, window.luckysheet.locales.ko);
      }
    } catch (e) {}

    // 이전에 생성된 인스턴스가 있다면 파괴하여 메모리 누수 방지
    if(window.luckysheetInstance) {
      window.luckysheet.destroy();
    }
    
    window.luckysheetInstance = true;
    window.luckysheet.create({
      container: 'luckysheet',
      lang: 'ko', // 한글 100% 적용
      title: '헬로CN닥스',
      data: sheetData,
      showinfobar: false,
      showsheetbar: true,
      enableAddRow: true,
      enableAddBackTop: true,
      hook: {
        updated: function() {
          if(!isInitializing) autoSaveToCloud();
        },
        rangeSelect: function() {
          if(!isInitializing) updateMyPresence();
        }
      }
    });
    
    isInitializing = false;
    document.getElementById('loading-mask').style.display = 'none';
    dbStatusText.innerText = "DB 실시간 동기화 됨";
  }

  // 내 변경사항을 서버로 저장
  function autoSaveToCloud() {
    clearTimeout(saveTimeout);
    dbStatusIndicator.classList.add('saving');
    dbStatusText.innerText = "데이터 저장 중...";

    saveTimeout = setTimeout(async () => {
      try {
        localLastSaveTime = new Date().getTime(); // 내가 저장한 시간 기록 (중복 새로고침 방지용)
        const allData = window.luckysheet.getAllSheets();
        await setDoc(doc(db, "sheets", "master_doc"), {
          content: JSON.stringify(allData),
          timestamp: localLastSaveTime
        });
        dbStatusIndicator.classList.remove('saving');
        dbStatusText.innerText = "DB 실시간 동기화 됨";
      } catch (error) {
        dbStatusText.innerText = "저장 오류 발생";
      }
    }, 1000); // 1초 대기 후 전송하여 과부하 방지
  }

  // 상단 동시 접속자 상태 표시
  function updateMyPresence() {
    if (!currentUserInfo) return;
    setDoc(doc(db, "presence", currentUserInfo.uid), {
      name: currentUserInfo.name, dept: currentUserInfo.dept, updatedAt: new Date().getTime()
    });
  }

  function listenPresence() {
    onSnapshot(collection(db, "presence"), (snapshot) => {
      let editingUsers = [];
      const now = new Date().getTime();
      snapshot.forEach(docSnap => {
        if(docSnap.id !== currentUserInfo?.uid) {
           const data = docSnap.data();
           // 최근 30초 내에 움직임이 있는 유저 표시
           if(now - data.updatedAt < 30000) {
             editingUsers.push(`${data.name}(${data.dept})`);
           }
        }
      });
      const badge = document.getElementById("concurrent-users");
      if(editingUsers.length > 0) {
        badge.innerText = `현재 함께 접속 중: ${editingUsers.join(', ')}`;
        badge.style.display = "inline-block";
      } else {
        badge.style.display = "none";
      }
    });
  }
</script>
</body>
</html>
