<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>헬로CN 닥스 프로</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
        /* 스크롤 및 레이아웃 최적화 */
        #grid-container { height: calc(100vh - 210px); }
        .grid-header { background-color: #f1f5f9; color: #334155; font-weight: bold; text-align: center; font-size: 12px; border: 1px solid #cbd5e1; user-select: none; position: sticky; top: 0; z-index: 10; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .grid-header-corner { position: sticky; top: 0; left: 0; z-index: 20; background-color: #e2e8f0; }
        .row-header { position: sticky; left: 0; z-index: 5; background-color: #f8fafc; font-weight: bold; color: #64748b; text-align: center; font-size: 11px; border-right: 1px solid #cbd5e1; border-bottom: 1px solid #cbd5e1; }
        
        .grid-cell { border-right: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; padding: 0; position: relative; background: #ffffff; min-width: 100px; transition: background-color 0.1s; }
        .cell-input { width: 100%; height: 100%; min-height: 28px; border: none; background: transparent; padding: 4px 6px; outline: none; font-size: 13px; }
        .cell-input:focus { background: #eff6ff; box-shadow: inset 0 0 0 2px #3b82f6; z-index: 2; position: relative; }
        .cell-select { width: 100%; height: 100%; border: none; background: transparent; padding: 2px 4px; outline: none; font-size: 12px; cursor: pointer; }
        
        /* 다중 선택 드래그 및 커서 영역 */
        .cell-selected { background-color: #e0f2fe !important; }
        .grid-cell.locked { background-color: #f8fafc; color: #94a3b8; }
        .memo-indicator { position: absolute; top: 0; right: 0; width: 0; height: 0; border-style: solid; border-width: 0 8px 8px 0; border-color: transparent #f59e0b transparent transparent; cursor: help; z-index: 1; }
        .cursor-indicator { position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px; border: 2px solid; pointer-events: none; z-index: 5; display: none; }
        .cursor-name { position: absolute; top: -20px; right: -2px; background: inherit; color: white; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px 4px 0px 4px; white-space: nowrap; }

        /* 열 너비 조절 핸들 */
        .resize-handle { position: absolute; right: 0; top: 0; bottom: 0; width: 5px; cursor: col-resize; z-index: 15; }
        .resize-handle:hover { background-color: #3b82f6; }

        @media print {
            body * { visibility: hidden; }
            #printable-area, #printable-area * { visibility: visible; }
            #printable-area { position: absolute; left: 0; top: 0; width: 100%; }
            .grid-header, .row-header { position: static !important; }
        }
    </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col overflow-hidden">

    <!-- 로딩 오버레이 -->
    <div id="initial-loader" class="fixed inset-0 bg-slate-900 z-[999] flex flex-col items-center justify-center text-white transition-opacity duration-200">
        <i class="fa-solid fa-circle-notch fa-spin text-5xl text-blue-500 mb-5"></i>
        <h2 class="text-xl font-bold tracking-tight">헬로CN 닥스 시스템 연결 중...</h2>
        <p class="text-slate-400 mt-2 text-sm">데이터베이스 인증 및 동기화를 진행하고 있습니다.</p>
    </div>

    <!-- 네비게이션바 -->
    <header class="bg-slate-900 text-white px-4 py-2.5 flex items-center justify-between shadow-md z-20">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 text-white p-1.5 rounded-lg font-bold"><i class="fa-solid fa-table"></i></div>
            <div>
                <h1 class="text-sm font-bold tracking-tight">헬로CN 닥스 PRO</h1>
                <p class="text-[10px] text-slate-400">데이터 무실손 동기화 시스템</p>

            <div id="sync-status" class="bg-slate-700 text-slate-300 px-2 py-1 rounded text-[10px] font-semibold flex items-center space-x-1.5 mr-2">

            <button id="admin-col-btn" onclick="openColumnManager()" class="hidden bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded text-xs font-semibold transition items-center space-x-1.5">

            <div class="flex items-center space-x-2 bg-slate-800 px-3 py-1.5 rounded border border-slate-700">

    <!-- 서식 툴바 (Google Docs 스타일) -->
    <div class="bg-white border-b border-slate-200 px-4 py-2 flex items-center justify-between text-slate-600 z-10 shadow-sm">
        <div class="flex items-center space-x-1">
            <!-- 폰트 스타일 -->
            <button onclick="applyFormat('b', true)" class="p-1.5 hover:bg-slate-100 rounded text-slate-700 tooltip" title="굵게"><i class="fa-solid fa-bold"></i></button>
            <div class="w-px h-5 bg-slate-300 mx-1"></div>
            <!-- 정렬 -->

            <button onclick="applyFormat('align', 'center')" class="p-1.5 hover:bg-slate-100 rounded text-slate-700" title="가운데 맞춤"><i class="fa-solid fa-align-center"></i></button>
            <button onclick="applyFormat('align', 'right')" class="p-1.5 hover:bg-slate-100 rounded text-slate-700" title="오른쪽 맞춤"><i class="fa-solid fa-align-right"></i></button>

            <!-- 색상 -->

            <!-- 메모 -->

            <button onclick="exportExcel()" class="text-xs bg-emerald-50 text-emerald-600 hover:bg-emerald-100 border border-emerald-200 px-3 py-1.5 rounded font-bold transition flex items-center"><i class="fa-solid fa-file-excel mr-1.5"></i>엑셀 다운</button>

    <!-- 메인 스프레드시트 컨테이너 -->
    <div class="flex-1 flex flex-col bg-white m-3 rounded-xl shadow-sm border border-slate-300 overflow-hidden relative" id="printable-area">
        <!-- 필터 상태바 -->
        <div class="bg-slate-50 px-3 py-1.5 border-b border-slate-200 flex items-center justify-between text-xs">
            <div class="flex items-center space-x-3">
                <span class="font-bold text-slate-700" id="selected-cell-indicator">A1</span>
                <span class="text-slate-300">|</span>
                <span id="edit-permission-status" class="text-slate-500 font-semibold"><i class="fa-solid fa-lock mr-1"></i> 로그인 대기</span>
                <span class="text-slate-300">|</span>
                <button onclick="clearMyFilters()" class="text-blue-600 hover:underline"><i class="fa-solid fa-filter-circle-xmark mr-1"></i>내 필터 초기화</button>

            <div class="flex space-x-2">

            </div>

        <!-- 엑셀 그리드 (스크롤 영역) -->

            <table id="spreadsheet-table" class="border-collapse bg-white table-fixed">

        <!-- 하단 상태 요약 바 (SUM, AVG) -->

            <div id="stat-sum" class="font-bold text-blue-600">합계: 0</div>
            <div id="stat-avg" class="font-bold text-emerald-600">평균: 0</div>
        </div>
        
        <!-- 하단 시트 탭 -->

            <button onclick="addNewSheet()" class="text-slate-500 hover:text-blue-600 px-2 py-1"><i class="fa-solid fa-plus"></i></button>
        </div>
    </div>

    <!-- 로그인, 설정 모달 등 (이전 코드와 동일 구조 유지하되 간소화) -->
    <div id="login-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-white w-[400px] rounded-xl shadow-2xl p-6">
            <h2 class="text-lg font-bold text-center mb-4">헬로CN 닥스 PRO</h2>
            <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                <input type="text" id="login-id" required placeholder="아이디 (suby20)" class="w-full border rounded-lg px-3 py-2 text-sm">

                <button type="submit" id="login-submit-btn" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-lg text-sm">로그인</button>
            </form>
        </div>
    </div>

    <!-- 차트 모달 -->
    <div id="chart-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50">
        <div class="bg-white w-[700px] rounded-xl shadow-2xl p-5 flex flex-col">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="font-bold">데이터 시각화 차트</h3>
                <button onclick="document.getElementById('chart-modal').classList.add('hidden')" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <canvas id="myChart" width="400" height="200"></canvas>
        </div>
    </div>

    <!-- 열 구조 편집 모달 (필터, 설정) -->
    <div id="column-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-white w-[750px] rounded-xl shadow-2xl overflow-hidden flex flex-col">
            <div class="bg-slate-900 text-white px-5 py-4 flex justify-between"><h3 class="font-bold text-sm">시트 및 항목 구조 설정</h3><button onclick="closeColumnManager()"><i class="fa-solid fa-xmark"></i></button></div>
            <div class="p-5 space-y-4 max-h-[60vh] overflow-y-auto">
                <div class="bg-slate-100 p-3 rounded-lg border flex justify-between items-center">
                    <div><span class="text-xs font-bold">엑셀 붙여넣기 헤더 줄수</span></div>
                    <select id="header-rows-select" class="border rounded px-2 py-1 text-xs font-bold text-blue-600"><option value="1">1줄 헤더</option><option value="2">2줄 헤더</option></select>
                </div>
                <div id="column-edit-list" class="space-y-2"></div>
                <button onclick="addColumnField()" class="w-full bg-slate-100 border-dashed border border-slate-400 py-2 rounded-lg text-xs font-bold">+ 항목 추가</button>
            </div>
            <div class="bg-slate-50 px-5 py-3 flex justify-end space-x-2 border-t">
                <button onclick="closeColumnManager()" class="bg-slate-200 px-4 py-1.5 rounded text-xs font-bold">취소</button>
                <button onclick="saveColumnChanges()" class="bg-blue-600 text-white px-4 py-1.5 rounded text-xs font-bold">서버 반영</button>
            </div>
        </div>
    </div>

    <!-- 계정 모달 -->
    <div id="account-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-white w-[600px] rounded-xl overflow-hidden"><div class="bg-slate-900 text-white px-5 py-4 flex justify-between"><h3 class="text-sm font-bold">권한 관리</h3><button onclick="closeAccountManager()"><i class="fa-solid fa-xmark"></i></button></div><div class="p-5 max-h-[60vh] overflow-y-auto"><div id="admin-account-list" class="space-y-2"></div></div></div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyALzPfEZrPFtS9JTtqWs6blOolUElOWgBI",
            authDomain: "hellocn-128ba.firebaseapp.com",
            projectId: "hellocn-128ba",
            storageBucket: "hellocn-128ba.firebasestorage.app",
            messagingSenderId: "306539866159",
            appId: "1:306539866159:web:164b7242c1d9f6e0233eda"
        });
        window.fb = { auth: getAuth(app), db: getFirestore(app), doc, setDoc, getDoc, onSnapshot, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged };
        window.initApp();
    </script>

    <!-- 핵심 로직 (수식, 필터, 선택, 클립보드 파싱) -->
    <script>
        // 전역 변수 세팅
        const ADMIN_HASH = "a259c0f997cb2f43cb12a554fb91dbefb28a2a979ce755b72166a0662d559868"; 
        const INITIAL_HASH_1470 = "ea817cbb346df91ee939ceaa6644f83cfecaa7e06a35043bf7e24a87cbb9797d"; 

        // 데이터 스키마 (문자열 값 대신 객체 배열을 사용하여 서식/메모 지원)
        let defaultSheetsData = {
            "월별실적": {
                headerRows: 1,
                columns: [
                    { name: "지역", type: "text", width: 120, validation: "none" },
                    { name: "목표액", type: "text", width: 150, validation: "number" },
                    { name: "실적액", type: "text", width: 150, validation: "number" },
                    { name: "상태", type: "select", options: "대기,완료", width: 100, validation: "none" }
                ],
                rows: [
                    [{v:"수도권",b:true,bg:"",align:"center",memo:""}, {v:"50000",b:false,bg:"",align:"right",memo:""}, {v:"48000",b:false,bg:"",align:"right",memo:""}, {v:"완료",b:false,bg:"",align:"center",memo:""}]
                ]
            }
        };

        let sheetsData = {};
        let accountsData = [];
        let currentAccount = null;
        let activeSheet = null;
        let isRemoteUpdating = false;
        
        // UI 상태 변수
        let myFilters = {}; // { colIndex: "필터값" }
        let selection = { startR: null, startC: null, endR: null, endC: null, active: false };
        let activeCell = { r: null, c: null };
        let chartInstance = null;
        let presenceColors = ['#ef4444', '#f97316', '#8b5cf6', '#ec4899', '#14b8a6'];

        function isPrivilegedRole(role) { return role === "최고관리자" || role === "서추" || role === "영추"; }
        
        // 🌟 마이그레이션 함수: 구형 문자열 데이터를 서식 지원 객체 포맷으로 자동 변환
        function migrateDataStructure(data) {
            Object.keys(data).forEach(sName => {
                if(!data[sName].headerRows) data[sName].headerRows = 1;
                data[sName].columns.forEach(c => {
                    if(!c.width) c.width = 120;
                    if(!c.validation) c.validation = (c.name.includes("액") || c.name.includes("수") || c.name.includes("율")) ? "number" : "none";
                });
                data[sName].rows = data[sName].rows.map(row => 
                    row.map(cell => {
                        if (typeof cell === 'string' || typeof cell === 'number') return { v: String(cell), b: false, bg: "", align: "left", memo: "" };
                        return cell || { v: "", b: false, bg: "", align: "left", memo: "" };
                    })
                );
            });
            return data;
        }

        // 앱 초기화 및 서버 덮어쓰기 방지
        window.initApp = function() {
            const { auth, db, doc, getDoc, onAuthStateChanged } = window.fb;
            onAuthStateChanged(auth, async (fbUser) => {
                const savedUserId = localStorage.getItem("hellocn_auth_userid");
                if (fbUser && savedUserId) {
                    try {
                        const accSnap = await getDoc(doc(db, "config", "accountsDoc"));
                        if (accSnap.exists()) accountsData = accSnap.data().accounts || [];
                        
                        const target = accountsData.find(a => a.userId === savedUserId);
                        if (target) {
                            currentAccount = target;
                            // 권한에 따른 자동 필터 설정 (담당자별 맞춤 뷰)
                            if (!isPrivilegedRole(currentAccount.role)) {
                                myFilters['autoRole'] = currentAccount.role; 
                            }
                            startDatabaseSync();
                            document.getElementById('initial-loader').classList.add('hidden');
                            updateUserInterface();
                        } else { forceLogout(); }
                    } catch(e) { forceLogout(); }
                } else {
                    document.getElementById('initial-loader').classList.add('hidden');
                    document.getElementById('login-modal').classList.remove('hidden');
                    document.getElementById('login-modal').classList.add('flex');
                }
            });
        };

        // 데이터베이스 동기화
        let unsubSheets, unsubAccounts, unsubPresence;
        function startDatabaseSync() {
            const { db, doc, onSnapshot } = window.fb;
            
            unsubAccounts = onSnapshot(doc(db, "config", "accountsDoc"), snap => {
                if (snap.exists()) accountsData = snap.data().accounts || [];
            });

            // 🌟 덮어쓰기 방지 및 파싱 로직 적용
            unsubSheets = onSnapshot(doc(db, "sheets", "mainDoc"), snap => {
                isRemoteUpdating = true;
                if (snap.exists()) {
                    try {
                        const raw = JSON.parse(snap.data().payload);
                        sheetsData = migrateDataStructure(raw);
                        if (!activeSheet || !sheetsData[activeSheet]) activeSheet = Object.keys(sheetsData)[0];
                        renderSheetTabs();
                        renderGrid();
                        setSyncStatus(true);
                    } catch(e) { console.error("데이터 파싱 실패"); }
                } else {
                    // 서버에 데이터가 진짜 없을 때만 1회 초기화
                    sheetsData = migrateDataStructure(JSON.parse(JSON.stringify(defaultSheetsData)));
                    activeSheet = Object.keys(sheetsData)[0];
                    saveSheetsToFirebase();
                }
                isRemoteUpdating = false;
            });

            // 실시간 커서 동기화
            unsubPresence = onSnapshot(doc(db, "presence", "cursors"), snap => {
                if (snap.exists() && activeSheet) {
                    drawRemoteCursors(snap.data().active || {});
                }
            });
        }

        async function saveSheetsToFirebase() {
            if (isRemoteUpdating) return;
            try {
                const { db, doc, setDoc } = window.fb;
                await setDoc(doc(db, "sheets", "mainDoc"), { payload: JSON.stringify(sheetsData), ts: Date.now() });
                setSyncStatus(true);
            } catch(e) { setSyncStatus(false); alert("저장 권한 없음: " + e.message); }
        }

        // 실시간 커서 방송
        async function broadcastCursor() {
            if(!currentAccount || !activeSheet || activeCell.r === null) return;
            try {
                const { db, doc, setDoc } = window.fb;
                await setDoc(doc(db, "presence", "cursors"), { 
                    [`active.${currentAccount.userId}`]: { sheet: activeSheet, r: activeCell.r, c: activeCell.c, name: currentAccount.name, ts: Date.now() }
                }, { merge: true });
            } catch(e) {}
        }

        function drawRemoteCursors(activeData) {
            document.querySelectorAll('.cursor-indicator').forEach(el => el.style.display = 'none');
            const now = Date.now();
            let colorIdx = 0;
            Object.keys(activeData).forEach(uid => {
                if (uid === currentAccount.userId) return;
                const pos = activeData[uid];
                if (pos.sheet === activeSheet && (now - pos.ts < 60000)) { // 1분 이내만 표시
                    const td = document.getElementById(`cell-${pos.r}-${pos.c}`);
                    if (td) {
                        const cur = td.querySelector('.cursor-indicator');
                        if (cur) {
                            cur.style.borderColor = presenceColors[colorIdx % presenceColors.length];
                            cur.querySelector('.cursor-name').innerText = pos.name;
                            cur.style.display = 'block';
                            colorIdx++;
                        }
                    }
                }
            });
        }

        // 🌟 수식 평가 엔진 (기본 지원: SUM, AVERAGE)
        function evaluateFormula(val, rIdx, cIdx) {
            if (!val.toString().startsWith('=')) return val;
            try {
                let formula = val.substring(1).toUpperCase();
                let sheet = sheetsData[activeSheet];
                
                // =SUM(열이름) 처리 (예: =SUM(실적액))
                if (formula.startsWith('SUM(')) {
                    let colName = formula.match(/SUM\((.*?)\)/)[1];
                    let tColIdx = sheet.columns.findIndex(c => c.name === colName);
                    if (tColIdx > -1) {
                        return sheet.rows.reduce((acc, row, idx) => {
                            if (idx === rIdx) return acc; // 자기 자신 제외 (순환참조 방지)
                            let num = parseFloat(row[tColIdx].v.replace(/,/g, ''));
                            return acc + (isNaN(num) ? 0 : num);
                        }, 0).toLocaleString();
                    }
                }
                return val; // 해석 실패 시 원본
            } catch(e) { return "#ERROR!"; }
        }

        // 화면 렌더링 코어
        function renderGrid() {
            const sheet = sheetsData[activeSheet];
            if (!sheet) return;
            
            const thead = document.getElementById('grid-thead');
            const tbody = document.getElementById('grid-tbody');
            thead.innerHTML = ''; tbody.innerHTML = '';

            // 헤더 생성
            let trH = document.createElement('tr');
            trH.innerHTML = `<th class="grid-header grid-header-corner w-12 py-1.5"><i class="fa-solid fa-list-ol text-slate-400"></i></th>`;
            sheet.columns.forEach((col, cIdx) => {
                // 필터 아이콘 분기
                let isFiltered = myFilters[cIdx] !== undefined;
                let filterIcon = `<i class="fa-solid fa-filter text-[10px] ${isFiltered ? 'text-blue-500' : 'text-slate-300'} hover:text-blue-600 ml-1 cursor-pointer" onclick="showFilterDropdown(${cIdx})"></i>`;
                
                trH.innerHTML += `<th class="grid-header relative" style="width:${col.width}px; min-width:${col.width}px;" id="col-header-${cIdx}">
                    <div class="px-2 py-1.5 flex items-center justify-between">
                        <span class="truncate">${col.name}</span>
                        ${filterIcon}
                    </div>
                    <div class="resize-handle" onmousedown="startColResize(event, ${cIdx})"></div>
                </th>`;
            });
            thead.appendChild(trH);

            // 데이터 렌더링
            sheet.rows.forEach((row, rIdx) => {
                // 1. 개인용 뷰(Role) 필터링
                let roleColIdx = sheet.columns.findIndex(c => c.name.includes("부서") || c.name.includes("지역"));
                if (myFilters['autoRole'] && roleColIdx > -1) {
                    if (!row[roleColIdx].v.includes(myFilters['autoRole'])) return;
                }

                // 2. 항목 필터링 (다중 교집합)
                let hideRow = false;
                Object.keys(myFilters).forEach(fIdx => {
                    if (fIdx !== 'autoRole') {
                        if (row[fIdx].v !== myFilters[fIdx]) hideRow = true;
                    }
                });
                if (hideRow) return;

                // 행 그리기
                let tr = document.createElement('tr');
                tr.innerHTML = `<td class="row-header relative group">
                    <span>${rIdx + 1}</span>
                    ${isPrivilegedRole(currentAccount?.role) ? `<button onclick="deleteRow(${rIdx})" class="absolute right-0 top-0 bottom-0 px-1 bg-red-100 text-red-600 hidden group-hover:flex items-center" title="행 삭제"><i class="fa-solid fa-trash text-[10px]"></i></button>` : ''}
                </td>`;

                let isLocked = false;
                if (!currentAccount) isLocked = true;
                else if (!isPrivilegedRole(currentAccount.role) && roleColIdx > -1) {
                    if (!row[roleColIdx].v.includes(currentAccount.role)) isLocked = true;
                }

                sheet.columns.forEach((col, cIdx) => {
                    let td = document.createElement('td');
                    td.id = `cell-${rIdx}-${cIdx}`;
                    td.className = `grid-cell ${isLocked ? 'locked' : ''}`;
                    
                    let cellData = row[cIdx] || { v: "", b: false, align: "left", bg: "", memo: "" };
                    
                    // 서식 적용
                    td.style.backgroundColor = cellData.bg || '';
                    td.style.fontWeight = cellData.b ? 'bold' : 'normal';
                    td.style.textAlign = cellData.align;

                    // 메모 표시기
                    let memoHtml = cellData.memo ? `<div class="memo-indicator" title="메모: ${cellData.memo}"></div>` : '';
                    let cursorHtml = `<div class="cursor-indicator" style="border-color: #3b82f6;"><span class="cursor-name"></span></div>`;

                    if (isLocked) {
                        td.innerHTML = `${memoHtml}${cursorHtml}<div class="px-2 py-1.5 text-xs text-slate-500 truncate select-none">${cellData.v}</div>`;
                    } else {
                        // 수식 계산
                        let displayVal = evaluateFormula(cellData.v, rIdx, cIdx);
                        
                        if (col.type === 'select') {
                            let select = document.createElement('select');
                            select.className = 'cell-select';
                            select.style.fontWeight = cellData.b ? 'bold' : 'normal';
                            select.style.textAlign = cellData.align;
                            select.innerHTML = `<option value="">--</option>` + (col.options||"").split(',').map(o=>`<option value="${o.trim()}" ${cellData.v===o.trim()?'selected':''}>${o.trim()}</option>`).join('');
                            
                            select.onchange = (e) => { sheet.rows[rIdx][cIdx].v = e.target.value; saveSheetsToFirebase(); };
                            select.onmousedown = () => selectCell(rIdx, cIdx);
                            td.innerHTML = memoHtml + cursorHtml;
                            td.appendChild(select);
                        } else {
                            let input = document.createElement('input');
                            input.type = 'text';
                            input.className = 'cell-input';
                            input.value = displayVal; // 수식 결과값 표시
                            input.style.fontWeight = cellData.b ? 'bold' : 'normal';
                            input.style.textAlign = cellData.align;
                            
                            // 입력 제한(유효성 검사)
                            if (col.validation === 'number') {
                                input.onkeydown = (e) => { if (e.key.length === 1 && !/[0-9\.\-=\b]/.test(e.key)) e.preventDefault(); };
                            } else if (col.validation === 'date') {
                                input.placeholder = "YYYY-MM-DD";
                            }

                            input.onfocus = () => { 
                                input.value = cellData.v; // 포커스 시 수식 원본 노출
                                selectCell(rIdx, cIdx); 
                            };
                            input.onblur = (e) => {
                                let newVal = e.target.value;
                                if (col.validation === 'date' && newVal && !/^\d{4}-\d{2}-\d{2}$/.test(newVal)) {
                                    alert("날짜는 YYYY-MM-DD 형식으로 입력하세요.");
                                    input.value = cellData.v; return;
                                }
                                sheet.rows[rIdx][cIdx].v = newVal; 
                                saveSheetsToFirebase();
                                input.value = evaluateFormula(newVal, rIdx, cIdx);
                            };
                            
                            // 다중 선택 드래그 이벤트 연결
                            td.onmousedown = (e) => startDragSelection(e, rIdx, cIdx);
                            td.onmouseenter = (e) => updateDragSelection(e, rIdx, cIdx);
                            td.onmouseup = endDragSelection;

                            td.innerHTML = memoHtml + cursorHtml;
                            td.appendChild(input);
                        }
                    }
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }

        // 필터링 기능 (내 화면용)
        function showFilterDropdown(cIdx) {
            let sheet = sheetsData[activeSheet];
            let uniqueVals = [...new Set(sheet.rows.map(r => r[cIdx].v))].filter(v => v);
            let val = prompt(`${sheet.columns[cIdx].name} 필터링할 값을 입력하세요:\n(값: ${uniqueVals.join(', ')})\n\n※ 필터를 해제하려면 빈 칸으로 확인을 누르세요.`);
            if (val !== null) {
                if (val.trim() === "") delete myFilters[cIdx];
                else myFilters[cIdx] = val.trim();
                renderGrid();
            }
        }
        function clearMyFilters() {
            let role = myFilters['autoRole'];
            myFilters = {};
            if(role) myFilters['autoRole'] = role; // 롤 필터는 유지
            renderGrid();
        }

        // 다중 셀 선택 및 통계 (SUM/AVG)
        function selectCell(r, c) {
            activeCell = { r, c };
            document.getElementById('selected-cell-indicator').innerText = String.fromCharCode(65 + c) + (r + 1);
            broadcastCursor();
            clearSelectionHighlight();
        }

        function startDragSelection(e, r, c) {
            if (e.target.tagName === 'INPUT' && document.activeElement === e.target) return; // 편집 중엔 드래그 안함
            selection.active = true;
            selection.startR = r; selection.startC = c;
            selection.endR = r; selection.endC = c;
            selectCell(r,c);
        }

        function updateDragSelection(e, r, c) {
            if (!selection.active) return;
            selection.endR = r; selection.endC = c;
            drawSelectionHighlight();
        }

        function endDragSelection() { selection.active = false; calculateStats(); }
        window.addEventListener('mouseup', endDragSelection);

        function drawSelectionHighlight() {
            document.querySelectorAll('.grid-cell').forEach(td => td.classList.remove('cell-selected'));
            let rMin = Math.min(selection.startR, selection.endR);
            let rMax = Math.max(selection.startR, selection.endR);
            let cMin = Math.min(selection.startC, selection.endC);
            let cMax = Math.max(selection.startC, selection.endC);
            
            for (let r = rMin; r <= rMax; r++) {
                for (let c = cMin; c <= cMax; c++) {
                    let td = document.getElementById(`cell-${r}-${c}`);
                    if (td) td.classList.add('cell-selected');
                }
            }
        }

        function calculateStats() {
            if (!selection.active && selection.startR !== null) {
                let rMin = Math.min(selection.startR, selection.endR);
                let rMax = Math.max(selection.startR, selection.endR);
                let cMin = Math.min(selection.startC, selection.endC);
                let cMax = Math.max(selection.startC, selection.endC);
                
                let sum = 0, count = 0, numCount = 0;
                let sheet = sheetsData[activeSheet];
                
                for (let r = rMin; r <= rMax; r++) {
                    for (let c = cMin; c <= cMax; c++) {
                        if(sheet.rows[r]) {
                            count++;
                            let val = sheet.rows[r][c].v.replace(/,/g, '');
                            if (!isNaN(parseFloat(val)) && val.trim() !== '') {
                                sum += parseFloat(val);
                                numCount++;
                            }
                        }
                    }
                }
                document.getElementById('stat-count').innerText = `선택: ${count}칸`;
                document.getElementById('stat-sum').innerText = `합계: ${sum.toLocaleString()}`;
                document.getElementById('stat-avg').innerText = `평균: ${numCount > 0 ? (sum/numCount).toLocaleString(undefined, {maximumFractionDigits:2}) : 0}`;
            }
        }
        function clearSelectionHighlight() {
            document.querySelectorAll('.grid-cell').forEach(td => td.classList.remove('cell-selected'));
            document.getElementById('stat-count').innerText = "선택: 0칸";
            document.getElementById('stat-sum').innerText = "합계: 0";
            document.getElementById('stat-avg').innerText = "평균: 0";
        }

        // 서식 툴바 액션
        function applyFormat(type, value) {
            if (activeCell.r === null) return alert("서식을 적용할 셀을 선택하세요.");
            let cell = sheetsData[activeSheet].rows[activeCell.r][activeCell.c];
            if (type === 'b') cell.b = !cell.b;
            if (type === 'align') cell.align = value;
            if (type === 'bg') cell.bg = value;
            saveSheetsToFirebase();
            renderGrid();
        }
        function addMemoToCell() {
            if (activeCell.r === null) return;
            let cell = sheetsData[activeSheet].rows[activeCell.r][activeCell.c];
            let memo = prompt("메모를 입력하세요:", cell.memo);
            if (memo !== null) {
                cell.memo = memo;
                saveSheetsToFirebase();
                renderGrid();
            }
        }

        // 🌟 다중 셀 클립보드 파싱 및 자동 확장 (Excel 연동 고도화)
        document.addEventListener('paste', function(e) {
            if (!currentAccount || activeCell.r === null) return;
            // 인풋 박스에서 편집 중이면 기본 텍스트 붙여넣기 허용
            if (e.target.tagName === 'INPUT' && document.activeElement === e.target && !e.clipboardData.getData('text').includes('\t')) return;

            let clipText = (e.clipboardData || window.clipboardData).getData('text');
            if (!clipText) return;

            let rawRows = clipText.split(/\r\n|\n|\r/);
            if (rawRows[rawRows.length - 1] === '') rawRows.pop(); // 엑셀 끝 공백행 제거
            if (rawRows.length === 0) return;

            let parsedMatrix = rawRows.map(r => r.split('\t').map(v => v.trim()));
            let sheet = sheetsData[activeSheet];
            let headerRowsCount = sheet.headerRows || 1;

            // 최고관리자는 항목(열) 자동 확장 및 헤더 치환
            if (isPrivilegedRole(currentAccount.role)) {
                let maxCols = Math.max(...parsedMatrix.map(r => r.length));
                // 열 부족 시 자동 확장
                while (sheet.columns.length < maxCols) {
                    sheet.columns.push({ name: `신규항목${sheet.columns.length+1}`, type: "text", width: 120, validation: "none" });
                    sheet.rows.forEach(r => r.push({ v: "", b: false, align: "left", bg: "", memo: "" }));
                }
                
                // A1 셀에서 붙여넣기 시 설정된 헤더 줄수(1줄/2줄)만큼 열 이름 치환
                if (rawRows.length > headerRowsCount && activeCell.r === 0 && activeCell.c === 0) {
                    if (headerRowsCount === 1) {
                        parsedMatrix[0].forEach((hName, idx) => { if(hName) sheet.columns[idx].name = hName; });
                        parsedMatrix = parsedMatrix.slice(1);
                    } else if (headerRowsCount === 2 && parsedMatrix.length >= 2) {
                        parsedMatrix[1].forEach((hName, idx) => { 
                            let finalName = hName || parsedMatrix[0][idx];
                            if(finalName) sheet.columns[idx].name = finalName; 
                        });
                        parsedMatrix = parsedMatrix.slice(2);
                    }
                }
            }

            // 데이터 블록 삽입 (쪼개서 입력)
            let startR = activeCell.r, startC = activeCell.c;
            parsedMatrix.forEach((rowData, rOffset) => {
                let tr = startR + rOffset;
                // 행 부족 시 자동 생성
                if (tr >= sheet.rows.length) {
                    let newR = Array(sheet.columns.length).fill().map(()=>({ v: "", b: false, align: "left", bg: "", memo: "" }));
                    if (!isPrivilegedRole(currentAccount.role)) newR[1].v = currentAccount.role; // 권한 락
                    sheet.rows.push(newR);
                }

                // 권한 체크 (내 지역만)
                if (!isPrivilegedRole(currentAccount.role)) {
                    let roleCol = sheet.columns.findIndex(c=>c.name.includes("부서")||c.name.includes("지역"));
                    if (roleCol>-1 && !sheet.rows[tr][roleCol].v.includes(currentAccount.role)) return;
                }

                rowData.forEach((val, cOffset) => {
                    let tc = startC + cOffset;
                    if (tc < sheet.columns.length) {
                        sheet.rows[tr][tc].v = val;
                    }
                });
            });

            saveSheetsToFirebase();
            renderGrid();
            e.preventDefault(); // 기본 붙여넣기(하나의 셀에 뭉쳐 들어가는 것) 방지
        });

        // 차트 시각화 (Chart.js)
        function showChart() {
            let sheet = sheetsData[activeSheet];
            let labelColIdx = 0; // 구분이나 지역 컬럼 (첫번째 문자열 컬럼)
            let dataColIdx = sheet.columns.findIndex(c => c.validation === 'number'); // 첫번째 숫자 컬럼
            
            if (dataColIdx === -1) return alert("차트를 그릴 수 있는 숫자(금액/실적) 열이 없습니다.");
            
            let labels = []; let dataset = [];
            sheet.rows.forEach(r => {
                labels.push(r[labelColIdx].v || "무명");
                let num = parseFloat(r[dataColIdx].v.replace(/,/g, ''));
                dataset.push(isNaN(num) ? 0 : num);
            });

            document.getElementById('chart-modal').classList.remove('hidden');
            document.getElementById('chart-modal').classList.add('flex');
            
            let ctx = document.getElementById('myChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{ label: sheet.columns[dataColIdx].name, data: dataset, backgroundColor: '#3b82f6', borderRadius: 4 }]
                },
                options: { responsive: true, plugins: { legend: { position: 'top' } } }
            });
        }

        // PDF 내보내기
        function exportPDF() {
            const element = document.getElementById('printable-area');
            const opt = {
                margin: 0.5,
                filename: `헬로CN_${activeSheet}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' }
            };
            html2pdf().set(opt).from(element).save();
        }

        // 기타 관리 기능 (행/시트 삭제, 설정 모달 등)
        function deleteRow(rIdx) {
            if(confirm(`${rIdx+1}행을 정말 삭제하시겠습니까?`)) {
                sheetsData[activeSheet].rows.splice(rIdx, 1);
                saveSheetsToFirebase();
                renderGrid();
            }
        }
        
        function deleteSheet(sName) {
            if (!isPrivilegedRole(currentAccount.role)) return;
            if (Object.keys(sheetsData).length <= 1) return alert("최소 1개의 시트는 유지해야 합니다.");
            if (confirm(`'${sName}' 시트를 삭제하시겠습니까?\n이 작업은 복구할 수 없습니다.`)) {
                delete sheetsData[sName];
                activeSheet = Object.keys(sheetsData)[0];
                saveSheetsToFirebase();
            }
        }

        function renderSheetTabs() {
            const container = document.getElementById('sheet-tabs');
            container.innerHTML = '';
            Object.keys(sheetsData).forEach(sheetName => {
                const isActive = sheetName === activeSheet;
                const btn = document.createElement('div');
                btn.className = `flex items-center px-3 py-1.5 rounded-t-lg text-xs font-semibold cursor-pointer border-t border-x ${isActive ? 'bg-white text-blue-600 border-slate-300 shadow-sm' : 'bg-slate-200 text-slate-500 border-transparent hover:bg-slate-300'}`;
                btn.innerHTML = `<i class="fa-solid fa-table-cells mr-1.5"></i><span onclick="switchSheet('${sheetName}')">${sheetName}</span>
                ${isPrivilegedRole(currentAccount?.role) ? `<i class="fa-solid fa-xmark ml-2 hover:text-red-500 text-slate-300" onclick="deleteSheet('${sheetName}')"></i>` : ''}`;
                container.appendChild(btn);
            });
        }
        function switchSheet(sName) { activeSheet = sName; clearSelectionHighlight(); renderSheetTabs(); renderGrid(); }

        function addNewRow() {
            let sheet = sheetsData[activeSheet];
            let newR = Array(sheet.columns.length).fill().map(()=>({ v: "", b: false, align: "left", bg: "", memo: "" }));
            if (!isPrivilegedRole(currentAccount.role)) {
                let roleCol = sheet.columns.findIndex(c=>c.name.includes("부서")||c.name.includes("지역"));
                if(roleCol > -1) newR[roleCol].v = currentAccount.role;
            }
            sheet.rows.push(newR);
            saveSheetsToFirebase();
            renderGrid();
        }

        function addNewSheet() {
            let sName = prompt("새 시트 이름:");
            if (sName && !sheetsData[sName]) {
                sheetsData[sName] = JSON.parse(JSON.stringify(defaultSheetsData["월별실적"])); // 템플릿 복사
                saveSheetsToFirebase();
                switchSheet(sName);
            }
        }

        // 로그인 모달 강제 팝업 (버그 방지)
        function forceLogout() {
            document.getElementById('initial-loader').classList.add('hidden');
            const m = document.getElementById('login-modal');
            m.classList.remove('hidden'); m.classList.add('flex');
            if(unsubSheets) unsubSheets(); if(unsubAccounts) unsubAccounts();
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            let userId = document.getElementById('login-id').value.trim().toLowerCase().replace('@helloconnectn.com', '');
            let pw = document.getElementById('login-pw').value.trim();
            const { auth, signInWithEmailAndPassword, createUserWithEmailAndPassword, db, getDoc, doc, setDoc } = window.fb;
            
            try {
                try { await signInWithEmailAndPassword(auth, userId+"@helloconnectn.com", "SYS!"+userId); } 
                catch(e) { await createUserWithEmailAndPassword(auth, userId+"@helloconnectn.com", "SYS!"+userId); }
                
                const snap = await getDoc(doc(db, "config", "accountsDoc"));
                if (snap.exists()) accountsData = snap.data().accounts || [];
                ensureMasterAdmins();

                const user = accountsData.find(a => a.userId === userId);
                if (!user) { alert("미등록 계정"); await window.fb.signOut(auth); return; }
                
                let inputHash = await hashPassword(pw);
                if (userId !== "suby20" && userId !== "abcd9420") {
                    if (pw !== "1470" && user.passwordHash !== inputHash) { alert("비밀번호 불일치"); await window.fb.signOut(auth); return; }
                } else if (pw !== "wpswkd20") { alert("비밀번호 불일치"); await window.fb.signOut(auth); return; }

                localStorage.setItem("hellocn_auth_userid", userId);
                location.reload(); // 깔끔한 리셋을 위해 리로드
            } catch(e) { alert("서버 오류: " + e.message); }
        }
        function handleLogout() {
            if(confirm("로그아웃 하시겠습니까?")) {
                localStorage.removeItem("hellocn_auth_userid");
                window.fb.signOut(window.fb.auth).then(()=>location.reload());
            }
        }

        function updateUserInterface() {
            document.getElementById('current-user-badge').innerText = `👤 ${currentAccount.name} (${currentAccount.role})`;
            document.getElementById('logout-btn').classList.remove('hidden');
            document.getElementById('logout-btn').classList.add('flex');
            if (isPrivilegedRole(currentAccount.role)) {
                document.getElementById('admin-col-btn').classList.remove('hidden'); document.getElementById('admin-col-btn').classList.add('flex');
                document.getElementById('admin-acc-btn').classList.remove('hidden'); document.getElementById('admin-acc-btn').classList.add('flex');
                document.getElementById('edit-permission-status').innerHTML = `<i class="fa-solid fa-shield-halved text-blue-500"></i> ${currentAccount.role} (전체 관리)`;
            } else {
                document.getElementById('edit-permission-status').innerHTML = `<i class="fa-solid fa-user-check text-amber-500"></i> ${currentAccount.role} 담당 편집`;
            }
        }

        // 시트 설정 / 계정 관리 (기존 로직 유지)
        function openColumnManager() {
            document.getElementById('column-modal').classList.remove('hidden'); document.getElementById('column-modal').classList.add('flex');
            document.getElementById('header-rows-select').value = sheetsData[activeSheet].headerRows || 1;
            let list = document.getElementById('column-edit-list'); list.innerHTML = '';
            sheetsData[activeSheet].columns.forEach((col, i) => {
                list.innerHTML += `<div class="flex items-center space-x-2 bg-slate-50 p-2 border rounded">
                    <span class="w-4 font-bold text-xs">${i+1}</span>
                    <input type="text" id="col-n-${i}" value="${col.name}" class="border rounded px-2 py-1 text-xs w-1/4">
                    <select id="col-v-${i}" class="border rounded px-2 py-1 text-xs w-1/5"><option value="none" ${col.validation==='none'?'selected':''}>일반 텍스트</option><option value="number" ${col.validation==='number'?'selected':''}>숫자 전용</option><option value="date" ${col.validation==='date'?'selected':''}>날짜 형식</option></select>
                    <select id="col-t-${i}" class="border rounded px-2 py-1 text-xs w-1/5"><option value="text" ${col.type==='text'?'selected':''}>입력창</option><option value="select" ${col.type==='select'?'selected':''}>드롭다운</option></select>
                    <input type="text" id="col-o-${i}" value="${col.options||''}" class="border rounded px-2 py-1 text-xs flex-1" placeholder="드롭다운 콤마구분">
                    <button onclick="sheetsData[activeSheet].columns.splice(${i},1); openColumnManager();" class="text-red-500"><i class="fa-solid fa-trash"></i></button>
                </div>`;
            });
        }
        function addColumnField() { sheetsData[activeSheet].columns.push({name:"새항목", type:"text", width:120, validation:"none"}); sheetsData[activeSheet].rows.forEach(r=>r.push({v:"", b:false, bg:"", align:"left", memo:""})); openColumnManager(); }
        function closeColumnManager() { document.getElementById('column-modal').classList.add('hidden'); document.getElementById('column-modal').classList.remove('flex'); }
        async function saveColumnChanges() {
            sheetsData[activeSheet].headerRows = parseInt(document.getElementById('header-rows-select').value);
            sheetsData[activeSheet].columns.forEach((col, i) => {
                col.name = document.getElementById(`col-n-${i}`).value;
                col.validation = document.getElementById(`col-v-${i}`).value;
                col.type = document.getElementById(`col-t-${i}`).value;
                col.options = document.getElementById(`col-o-${i}`).value;
            });
            await saveSheetsToFirebase(); closeColumnManager(); renderGrid(); alert("설정 저장됨");
        }
        
        function openAccountManager() {
            document.getElementById('account-modal').classList.remove('hidden'); document.getElementById('account-modal').classList.add('flex');
            let list = document.getElementById('admin-account-list'); list.innerHTML = '';
            accountsData.forEach((a, i) => {
                list.innerHTML += `<div class="flex justify-between p-2 border-b text-xs"><span>${a.name} (${a.userId}) - ${a.role}</span>
                ${(a.userId==='suby20'||a.userId==='abcd9420') ? '마스터' : `<button onclick="accountsData.splice(${i},1); saveAccountsToFirebase(); openAccountManager();" class="text-red-500"><i class="fa-solid fa-trash"></i></button>`}</div>`;
            });
        }
        function closeAccountManager() { document.getElementById('account-modal').classList.add('hidden'); document.getElementById('account-modal').classList.remove('flex'); }
        function exportExcel() {
            let wb = XLSX.utils.book_new();
            Object.keys(sheetsData).forEach(s => {
                let sheet = sheetsData[s];
                let aoa = [sheet.columns.map(c=>c.name), ...sheet.rows.map(r=>r.map(c=>c.v))];
                XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), s);
            });
            XLSX.writeFile(wb, "헬로CN_닥스_데이터.xlsx");
        }
    </script>
</body>
</html>
