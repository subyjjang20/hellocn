<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>헬로CN닥스 - 실시간 웹 엑셀</title>

  <!-- Luckysheet UI 라이브러리 -->
  <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/plugins/css/pluginsCss.css' />
  <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/plugins/plugins.css' />
  <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/css/luckysheet.css' />
  <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/assets/iconfont/iconfont.css' />
  <script src="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/plugins/js/plugin.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/luckysheet.umd.js"></script>

  <style>
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; overflow: hidden; }
    
    .screen { display: none; width: 100%; height: 100%; flex-direction: column; }
    .screen.active { display: flex; }

    /* 로그인 화면 */
    #login-screen { justify-content: center; align-items: center; background: #f0f2f5; }
    .login-box { background: #ffffff; padding: 48px 40px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.08); width: 440px; text-align: center; box-sizing: border-box; }
    .login-logo { width: 50px; height: 50px; background: #1a73e8; color: white; border-radius: 12px; display: inline-flex; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; margin-bottom: 20px; }
    .login-box h2 { margin: 0 0 30px 0; color: #202124; font-size: 24px; font-weight: 700; }
    
    .id-wrapper { display: flex; align-items: stretch; border: 1px solid #dadce0; border-radius: 8px; overflow: hidden; background: #fff; margin-bottom: 16px; transition: border 0.2s; }
    .id-wrapper:focus-within { border: 1px solid #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,0.2); }
    .id-wrapper input { border: none; padding: 14px 16px; flex: 1; outline: none; font-size: 15px; color: #202124; min-width: 0; }
    .id-wrapper span { padding: 0 16px; color: #5f6368; font-size: 14px; background: #f8f9fa; border-left: 1px solid #dadce0; display: flex; align-items: center; font-weight: 500; white-space: nowrap; }
    
    .pw-input { width: 100%; padding: 14px 16px; border: 1px solid #dadce0; border-radius: 8px; box-sizing: border-box; font-size: 15px; margin-bottom: 24px; transition: 0.2s; }
    .pw-input:focus { border: 1px solid #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,0.2); outline: none; }
    
    button.primary-btn { width: 100%; padding: 14px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 4px rgba(26,115,232,0.3); }
    button.primary-btn:hover { background: #1557b0; box-shadow: 0 4px 8px rgba(26,115,232,0.4); }
    button.small-btn { padding: 6px 10px; background: #1a73e8; color: white; border: none; border-radius: 5px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    button.small-btn:hover { opacity: 0.9; }
    button.danger-btn { background: #ea4335; }

    /* 상단 헤더바 */
    .header-bar { height: 60px; min-height: 60px; background: #ffffff; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 10; box-shadow: 0 1px 4px rgba(0,0,0,0.08); flex-shrink: 0; }
    .header-left { display: flex; align-items: center; gap: 14px; flex-wrap: nowrap; }
    .header-title { font-size: 18px; font-weight: 800; color: #1a73e8; margin-right: 4px; }
    .header-info { font-size: 13px; font-weight: 600; color: #3c4043; background: #f1f3f4; padding: 6px 12px; border-radius: 6px; }
    
    .db-status { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #34a853; background: #e6f4ea; padding: 6px 12px; border-radius: 20px; transition: 0.2s; }
    .status-dot { width: 8px; height: 8px; background-color: #34a853; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(52, 168, 83, 0.6); } 70% { box-shadow: 0 0 0 6px rgba(52, 168, 83, 0); } 100% { box-shadow: 0 0 0 0; } }
    .db-status.saving .status-dot { background-color: #fbbc04; animation: none; }
    .db-status.saving { color: #b08d00; background: #fef7e0; }
    .db-status.syncing .status-dot { background-color: #1a73e8; animation: none; }
    .db-status.syncing { color: #1967d2; background: #e8f0fe; }
    .db-status.error .status-dot { background-color: #ea4335; animation: none; }
    .db-status.error { color: #c5221f; background: #fce8e6; }

    #concurrent-users { display: none; background: #e8f0fe; color: #1967d2; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }
    
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .header-actions button { padding: 8px 14px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    #btn-manual-save { background: #1a73e8; color: white; }
    #btn-manual-save:hover { background: #1557b0; }
    #btn-show-admin { background: #34a853; color: white; }
    #btn-show-admin:hover { background: #2d9047; }
    #btn-logout { background: #fff; color: #5f6368; border: 1px solid #dadce0; }
    #btn-logout:hover { background: #f8f9fa; color: #202124; }

    /* 엑셀 컨테이너 */
    #spreadsheet-container { flex: 1; width: 100vw; position: relative; height: calc(100vh - 60px); background: #fff; }
    #luckysheet { margin: 0; padding: 0; position: absolute; width: 100%; height: 100%; left: 0; top: 0; }

    #loading-mask { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #1a73e8; font-weight: bold; font-size: 15px; }
    .spinner { width: 36px; height: 36px; border: 4px solid #e0e0e0; border-top: 4px solid #1a73e8; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* 관리자 모달 */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.45); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(2px); }
    .modal-content { background: white; padding: 28px 32px; border-radius: 16px; width: 620px; max-width: 95vw; box-shadow: 0 10px 40px rgba(0,0,0,0.15); box-sizing: border-box; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-header h3 { margin: 0; font-size: 18px; color: #202124; }
    .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #5f6368; padding: 0; }
    
    .admin-tabs { display: flex; border-bottom: 1px solid #ddd; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px; background: none; border: none; font-size: 14px; font-weight: 600; color: #5f6368; cursor: pointer; border-bottom: 3px solid transparent; }
    .tab-btn.active { color: #1a73e8; border-bottom-color: #1a73e8; }
    
    .modal-view { display: none; }
    .modal-view.active { display: block; }
    .modal-content label { display: block; font-size: 13px; color: #5f6368; font-weight: 600; margin-bottom: 6px; }
    .modal-content input:not(#new-id), .modal-content select { width: 100%; padding: 11px 12px; margin-bottom: 14px; border: 1px solid #dadce0; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
    
    .user-table-container { max-height: 360px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; }
    .user-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .user-table th, .user-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; vertical-align: middle; }
    .user-table th { font-weight: 600; color: #5f6368; background: #f8f9fa; position: sticky; top: 0; z-index: 1; }
    .action-buttons { display: flex; gap: 6px; }
    .role-badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; }
    .role-admin { background: #e6f4ea; color: #137333; }
    .role-user { background: #f1f3f4; color: #5f6368; }
  </style>
</head>
<body>

<!-- 로그인 화면 -->
<div id="login-screen" class="screen active">
  <div class="login-box">
    <div class="login-logo">N</div>
    <h2>헬로CN닥스</h2>
    <div class="id-wrapper">
      <input type="text" id="login-id" placeholder="아이디 (예: suby20)" autocomplete="username">
      <span>@helloconnectn.com</span>
    </div>
    <input type="password" id="login-pw" class="pw-input" placeholder="비밀번호" autocomplete="current-password">
    <button id="btn-login" class="primary-btn">시스템 접속</button>
  </div>
</div>

<!-- 메인 엑셀 화면 -->
<div id="main-screen" class="screen">
  <div class="header-bar">
    <div class="header-left">
      <div class="header-title">헬로CN닥스</div>
      <div class="header-info" id="user-info-display">확인 중...</div>
      <div id="db-status-indicator" class="db-status">
        <span class="status-dot"></span>
        <span id="db-status-text">DB 연결 중...</span>
      </div>
      <div id="concurrent-users"></div>
    </div>
    <div class="header-actions">
      <button id="btn-manual-save" title="현재 시트 내용을 즉시 서버에 저장합니다">즉시 저장</button>
      <button id="btn-show-admin" style="display: none;">계정 관리(관리자)</button>
      <button id="btn-logout">로그아웃</button>
    </div>
  </div>
  <div id="spreadsheet-container">
    <div id="loading-mask">
      <div class="spinner"></div>
      <div id="loading-text">엑셀 데이터를 실시간 연결 중입니다...</div>
    </div>
    <div id="luckysheet"></div>
  </div>
</div>

<!-- 관리자 계정 관리 모달 -->
<div id="admin-modal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h3>계정 관리 패널 (관리자 전용)</h3>
      <button id="btn-close-admin" class="close-btn">&times;</button>
    </div>
    <div class="admin-tabs">
      <button id="tab-list" class="tab-btn active">등록된 사용자 목록</button>
      <button id="tab-create" class="tab-btn">+ 신규 계정 발급</button>
    </div>

    <!-- 사용자 목록 탭 -->
    <div id="view-list" class="modal-view active">
      <div class="user-table-container">
        <table class="user-table">
          <thead>
            <tr>
              <th>아이디</th>
              <th>성명 / 부서</th>
              <th>권한</th>
              <th>계정 관리 (PW변경 / 삭제)</th>
            </tr>
          </thead>
          <tbody id="user-list-body">
            <tr><td colspan="4" style="text-align:center;">데이터를 불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    
    <!-- 신규 계정 발급 탭 -->
    <div id="view-create" class="modal-view">
      <label>아이디</label>
      <div class="id-wrapper" style="margin-bottom: 14px;">
        <input type="text" id="new-id" placeholder="아이디 입력" style="margin:0; border:none; padding:12px 16px;">
        <span>@helloconnectn.com</span>
      </div>
      <label>성명</label><input type="text" id="new-name" placeholder="예: 홍길동">
      <label>부서명</label><input type="text" id="new-dept" placeholder="예: 부평센터">
      <label>권한</label>
      <select id="new-role">
        <option value="user">일반 사용자 (user)</option>
        <option value="admin">관리자 (admin)</option>
      </select>
      <label>초기 비밀번호</label><input type="password" id="new-pw" placeholder="6자리 이상 입력">
      <button id="btn-create-user" class="primary-btn">계정 생성 및 등록</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updatePassword, deleteUser, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
  import { initializeFirestore, doc, setDoc, getDoc, getDocs, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyALzPfEZrPFtS9JTtqWs6blOolUElOWgBI",
    authDomain: "hellocn-128ba.firebaseapp.com",
    projectId: "hellocn-128ba",
    storageBucket: "hellocn-128ba.firebasestorage.app",
    messagingSenderId: "306539866159",
    appId: "1:306539866159:web:164b7242c1d9f6e0233eda",
    measurementId: "G-ETFMQX75CB"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = initializeFirestore(app, { experimentalForceLongPolling: true });

  const secondaryApp = initializeApp(firebaseConfig, "SecondaryApp");
  const secondaryAuth = getAuth(secondaryApp);
  const domain = "@helloconnectn.com";

  // ★ 브라우저 창(탭)마다 고유 세션 ID 부여 (동일 계정으로 여러 창을 띄워도 실시간 동기화 작동)
  const clientSessionId = "sess_" + Math.random().toString(36).substring(2, 10) + "_" + Date.now();

  let currentUserInfo = null;
  let saveTimeout = null;
  let isInitializing = true;
  let isApplyingRemoteUpdate = false;
  let lastSyncedJson = "";
  let sheetUnsubscribe = null;
  let presenceUnsubscribe = null;
  let currentCellLabel = "A1";

  const dbStatusIndicator = document.getElementById('db-status-indicator');
  const dbStatusText = document.getElementById('db-status-text');

  // 숫자를 엑셀 열 알파벳(A, B, C...)으로 변환
  function colToLetter(col) {
    let temp, letter = '';
    while (col >= 0) {
      temp = col % 26;
      letter = String.fromCharCode(temp + 65) + letter;
      col = Math.floor((col - temp) / 26) - 1;
    }
    return letter;
  }

  function getDefaultData() {
    const centers = ['통합대시보드', '부평센터', '계양센터', '해운대센터', '서부센터', '양산센터', '대구동구센터', '경주센터', '양천센터', '나라센터', '강릉센터', '속초센터'];
    return centers.map((center, idx) => ({
      name: center,
      index: String(idx),
      order: idx,
      status: idx === 0 ? 1 : 0,
      row: 50,
      column: 20,
      config: {},
      celldata: []
    }));
  }

  // 2차원 런타임 배열(sheet.data)에서 실제 값이 있는 셀만 1차원 celldata로 직렬화
  function serializeSheets(rawSheets) {
    if (!Array.isArray(rawSheets)) return [];
    return rawSheets.map((sheet, idx) => {
      let celldata = [];
      if (sheet.data && Array.isArray(sheet.data) && sheet.data.length > 0) {
        for (let r = 0; r < sheet.data.length; r++) {
          const rowArr = sheet.data[r];
          if (!rowArr) continue;
          for (let c = 0; c < rowArr.length; c++) {
            const cell = rowArr[c];
            if (cell !== null && cell !== undefined && Object.keys(cell).length > 0) {
              celldata.push({ r, c, v: cell });
            }
          }
        }
      } else if (sheet.celldata && Array.isArray(sheet.celldata)) {
        celldata = sheet.celldata;
      }

      return {
        name: sheet.name || `Sheet${idx + 1}`,
        index: sheet.index !== undefined ? String(sheet.index) : String(idx),
        order: sheet.order !== undefined ? sheet.order : idx,
        status: sheet.status !== undefined ? sheet.status : (idx === 0 ? 1 : 0),
        row: Math.max(sheet.row || 50, 50),
        column: Math.max(sheet.column || 20, 20),
        config: sheet.config || {},
        calcChain: sheet.calcChain || [],
        frozen: sheet.frozen || null,
        celldata: celldata
      };
    });
  }

  // 엔터키 로그인
  document.getElementById('login-pw').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('btn-login').click();
  });

  document.getElementById('btn-login').addEventListener('click', async () => {
    const rawId = document.getElementById('login-id').value.trim();
    const id = rawId.includes('@') ? rawId.split('@')[0] : rawId;
    const pw = document.getElementById('login-pw').value;
    if (!id || !pw) return alert("아이디와 비밀번호를 입력하세요.");

    const email = id + domain;
    try {
      const cred = await signInWithEmailAndPassword(auth, email, pw);
      await setDoc(doc(db, "users", cred.user.uid), { email: email, pw: pw }, { merge: true });
    } catch (err) {
      alert("로그인 실패: 아이디 또는 비밀번호를 확인하세요.");
    }
  });

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      document.getElementById('login-screen').classList.remove('active');
      document.getElementById('main-screen').classList.add('active');

      initExcel();

      try {
        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (!userDoc.exists()) {
          alert("관리자에 의해 삭제되었거나 권한이 없는 계정입니다.");
          await signOut(auth);
          window.location.reload();
          return;
        }
        const data = userDoc.data();
        if (!data.email && user.email) {
          await setDoc(doc(db, "users", user.uid), { email: user.email }, { merge: true });
          data.email = user.email;
        }
        currentUserInfo = { ...data, uid: user.uid };
        document.getElementById('user-info-display').innerText = `${currentUserInfo.name} (${currentUserInfo.dept}) - ${currentUserInfo.role === 'admin' ? '관리자' : '사용자'}`;
        document.getElementById('btn-show-admin').style.display = currentUserInfo.role === 'admin' ? 'inline-block' : 'none';
        
        updateMyPresence();
        listenPresence();
      } catch (e) {
        console.error("사용자 정보 로드 오류:", e);
      }
    } else {
      document.getElementById('login-screen').classList.add('active');
      document.getElementById('main-screen').classList.remove('active');
      currentUserInfo = null;
    }
  });

  document.getElementById('btn-logout').addEventListener('click', async () => {
    if (sheetUnsubscribe) sheetUnsubscribe();
    if (presenceUnsubscribe) presenceUnsubscribe();
    await signOut(auth);
    window.location.reload();
  });

  document.getElementById('btn-manual-save').addEventListener('click', () => {
    if (window.luckysheet && typeof window.luckysheet.exitEditMode === 'function') {
      window.luckysheet.exitEditMode();
    }
    saveToCloudNow(true);
  });

  // 엑셀 렌더링 함수
  function renderLuckysheet(sheetData) {
    window.luckysheet.create({
      container: 'luckysheet',
      lang: 'en',
      title: '헬로CN닥스',
      data: sheetData,
      showinfobar: false,
      showsheetbar: true,
      enableAddRow: true,
      enableAddBackTop: true,
      hook: {
        cellUpdated: function() {
          if (!isInitializing && !isApplyingRemoteUpdate) triggerAutoSave(150);
        },
        updated: function() {
          if (!isInitializing && !isApplyingRemoteUpdate) triggerAutoSave(150);
        },
        rangeSelect: function(sheet, range) {
          if (!isInitializing) {
            if (range && range[0] && range[0].row && range[0].column) {
              currentCellLabel = `${colToLetter(range[0].column[0])}${range[0].row[0] + 1}`;
            }
            updateMyPresence(sheet?.name);
            // 셀 편집 후 다른 셀로 이동했을 때 변경사항이 있으면 즉시 자동 저장
            if (!isApplyingRemoteUpdate) triggerAutoSave(150);
          }
        }
      }
    });
  }

  // 초기 엑셀 로드 및 이벤트 바인딩
  async function initExcel() {
    if (window.luckysheetInstance) return;
    window.luckysheetInstance = true;

    let sheetData = null;
    let needsCleanupSave = false;

    try {
      const fetchPromise = getDoc(doc(db, "sheets", "master_doc"));
      const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error("DB_TIMEOUT")), 4000));
      
      const sheetDoc = await Promise.race([fetchPromise, timeoutPromise]);
      if (sheetDoc && sheetDoc.exists() && sheetDoc.data().content) {
        const parsed = JSON.parse(sheetDoc.data().content);
        if (Array.isArray(parsed) && parsed.length > 0) {
          if (parsed.some(s => s.data && s.data.length > 0)) {
            needsCleanupSave = true;
          }
          sheetData = serializeSheets(parsed);
          lastSyncedJson = JSON.stringify(sheetData);
        }
      }
    } catch (err) {
      console.warn("초기 문서 로드 지연 또는 신규 문서:", err.message);
    }

    if (!sheetData) {
      sheetData = getDefaultData();
      lastSyncedJson = JSON.stringify(sheetData);
    }

    requestAnimationFrame(() => {
      renderLuckysheet(sheetData);

      isInitializing = false;
      document.getElementById('loading-mask').style.display = 'none';
      dbStatusIndicator.classList.remove('saving', 'error', 'syncing');
      dbStatusText.innerText = "DB 실시간 연결됨";

      if (needsCleanupSave) {
        saveToCloudNow(true);
      }

      // 키보드(Delete, 붙여넣기, 실행취소 등) 및 상단 툴바(색상, 굵기, 병합 등) 조작 시에도 즉시 자동 저장 작동
      const container = document.getElementById('spreadsheet-container');
      container.addEventListener('keyup', (e) => {
        if (isInitializing || isApplyingRemoteUpdate) return;
        if (['Enter', 'Tab', 'Delete', 'Backspace'].includes(e.key) || e.ctrlKey || e.metaKey) {
          triggerAutoSave(200);
        }
      });
      container.addEventListener('mouseup', () => {
        if (isInitializing || isApplyingRemoteUpdate) return;
        setTimeout(() => triggerAutoSave(250), 50);
      });

      listenRemoteSheetChanges();
    });
  }

  function triggerAutoSave(delayMs = 150) {
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
      saveToCloudNow(false);
    }, delayMs);
  }

  // 변경된 내용이 있을 때만 Firestore에 즉시 전송
  async function saveToCloudNow(force = false) {
    if (!window.luckysheet || isInitializing || isApplyingRemoteUpdate) return;
    clearTimeout(saveTimeout);

    try {
      const liveFiles = window.luckysheet.getluckysheetfile();
      if (!liveFiles) return;

      const cleanSheets = serializeSheets(liveFiles);
      const currentJson = JSON.stringify(cleanSheets);

      // 이전 저장 상태와 비교해 실제 변경된 셀/서식이 없으면 불필요한 DB 전송 생략
      if (!force && currentJson === lastSyncedJson) return;

      lastSyncedJson = currentJson;
      dbStatusIndicator.classList.add('saving');
      dbStatusText.innerText = "실시간 저장 중...";

      const now = Date.now();
      await setDoc(doc(db, "sheets", "master_doc"), {
        content: currentJson,
        sessionId: clientSessionId,
        updatedBy: currentUserInfo ? currentUserInfo.uid : "unknown",
        updatedByName: currentUserInfo ? `${currentUserInfo.name}(${currentUserInfo.dept})` : "사용자",
        timestamp: now
      });

      dbStatusIndicator.classList.remove('saving', 'error', 'syncing');
      const timeStr = new Date(now).toLocaleTimeString('ko-KR', { hour12: false });
      dbStatusText.innerText = `실시간 동기화됨 (${timeStr})`;
    } catch (error) {
      console.error("저장 실패:", error);
      dbStatusIndicator.classList.remove('saving', 'syncing');
      dbStatusIndicator.classList.add('error');
      dbStatusText.innerText = "동기화 오류 (재시도 중)";
    }
  }

  // ★ 핵심: 상대방이 수정한 데이터를 받아 내 화면의 라이브 메모리(getluckysheetfile)와 캔버스를 즉시 갱신
  function listenRemoteSheetChanges() {
    let isFirstSnapshot = true;

    sheetUnsubscribe = onSnapshot(doc(db, "sheets", "master_doc"), (docSnap) => {
      if (isFirstSnapshot) {
        isFirstSnapshot = false;
        return;
      }
      if (!docSnap.exists()) return;
      const docData = docSnap.data();

      // 내 브라우저 탭(clientSessionId)에서 방금 보낸 데이터는 무시
      if (docData.sessionId && docData.sessionId === clientSessionId) return;
      if (!docData.content || docData.content === lastSyncedJson) return;

      try {
        const remoteSheets = JSON.parse(docData.content);
        if (!Array.isArray(remoteSheets) || remoteSheets.length === 0) return;

        isApplyingRemoteUpdate = true;
        lastSyncedJson = docData.content;

        // 복제본(getAllSheets)이 아닌 실제 라이브 메모리(getluckysheetfile) 참조 획득
        const liveSheets = window.luckysheet.getluckysheetfile();
        if (!liveSheets) return;

        // 시트 추가/삭제/이름변경 여부 확인
        const structureChanged = liveSheets.length !== remoteSheets.length ||
          liveSheets.some((s, i) => s.name !== remoteSheets[i]?.name || String(s.index) !== String(remoteSheets[i]?.index));

        if (structureChanged) {
          // 시트 탭 구조가 바뀐 경우 현재 활성 시트 상태를 유지하며 재렌더링
          const currentActive = liveSheets.find(s => s.status == 1);
          if (currentActive) {
            remoteSheets.forEach(rs => {
              rs.status = (String(rs.index) === String(currentActive.index)) ? 1 : 0;
            });
          }
          window.luckysheet.destroy();
          renderLuckysheet(remoteSheets);
        } else {
          // 셀 값, 수식, 서식(색상/폰트/테두리/병합/행열크기) 실시간 인플레이스 업데이트
          let activeSheetOrder = 0;
          const activeSheetChanges = [];

          remoteSheets.forEach((rSheet, sIdx) => {
            const lSheet = liveSheets.find(s => String(s.index) === String(rSheet.index)) || liveSheets[sIdx];
            if (!lSheet) return;

            const isActive = (lSheet.status == 1);
            if (isActive) activeSheetOrder = lSheet.order !== undefined ? lSheet.order : sIdx;

            // 1. 병합, 테두리, 행/열 너비 등 config 객체를 참조 유지하며 갱신
            if (!lSheet.config) lSheet.config = {};
            Object.keys(lSheet.config).forEach(k => delete lSheet.config[k]);
            Object.assign(lSheet.config, rSheet.config || {});

            lSheet.calcChain = rSheet.calcChain || [];
            lSheet.celldata = rSheet.celldata || [];

            // 2. 원격 celldata 맵 생성
            const remoteMap = new Map();
            (rSheet.celldata || []).forEach(item => {
              remoteMap.set(`${item.r}_${item.c}`, item.v);
            });

            // 3. 이미 메모리에 로드된 2차원 data 배열(캔버스 렌더링 소스) 직접 갱신
            if (lSheet.data && Array.isArray(lSheet.data)) {
              for (let r = 0; r < lSheet.data.length; r++) {
                if (!lSheet.data[r]) continue;
                for (let c = 0; c < lSheet.data[r].length; c++) {
                  const key = `${r}_${c}`;
                  const localCell = lSheet.data[r][c];
                  const remoteCell = remoteMap.has(key) ? remoteMap.get(key) : null;

                  if (JSON.stringify(localCell) !== JSON.stringify(remoteCell)) {
                    lSheet.data[r][c] = remoteCell;
                    if (isActive) {
                      activeSheetChanges.push({ r, c, v: remoteCell });
                    }
                  }
                  remoteMap.delete(key);
                }
              }

              // 기존 행/열 범위를 넘어 새로 입력된 셀 반영
              remoteMap.forEach((val, key) => {
                const [r, c] = key.split('_').map(Number);
                if (lSheet.data[r]) {
                  lSheet.data[r][c] = val;
                  if (isActive) {
                    activeSheetChanges.push({ r, c, v: val });
                  }
                }
              });
            }
          });

          // 4. 현재 화면에 보고 있는 시트의 캔버스 즉시 리페인트
          if (activeSheetChanges.length > 0 && typeof window.luckysheet.setCellValue === 'function') {
            activeSheetChanges.forEach((chg, idx) => {
              const isLast = (idx === activeSheetChanges.length - 1);
              window.luckysheet.setCellValue(chg.r, chg.c, chg.v, { order: activeSheetOrder, isRefresh: isLast });
              // setCellValue 호출 후 스타일(배경색, 굵기 등)이 유실되지 않도록 원본 셀 객체 재주입
              const activeSheet = liveSheets.find(s => s.status == 1) || liveSheets[activeSheetOrder];
              if (activeSheet && activeSheet.data && activeSheet.data[chg.r]) {
                activeSheet.data[chg.r][chg.c] = chg.v;
              }
            });
          }

          if (typeof window.luckysheet.jfrefreshgrid === 'function') {
            window.luckysheet.jfrefreshgrid();
          }
        }

        dbStatusIndicator.classList.remove('saving', 'error');
        dbStatusIndicator.classList.add('syncing');
        const timeStr = new Date().toLocaleTimeString('ko-KR', { hour12: false });
        dbStatusText.innerText = `🔄 ${docData.updatedByName || '상대방'} 수정 반영 (${timeStr})`;
      } catch (e) {
        console.error("실시간 수신 반영 오류:", e);
      } finally {
        setTimeout(() => { isApplyingRemoteUpdate = false; }, 150);
      }
    });
  }

  // 동시 접속자 및 현재 편집 중인 셀 위치 실시간 공유
  function updateMyPresence(sheetName) {
    if (!currentUserInfo) return;
    let activeSheetName = sheetName;
    if (!activeSheetName && window.luckysheet && typeof window.luckysheet.getluckysheetfile === 'function') {
      const files = window.luckysheet.getluckysheetfile();
      const active = files ? files.find(s => s.status == 1) : null;
      if (active) activeSheetName = active.name;
    }
    setDoc(doc(db, "presence", clientSessionId), {
      uid: currentUserInfo.uid,
      name: currentUserInfo.name,
      dept: currentUserInfo.dept,
      sheet: activeSheetName || "통합대시보드",
      cell: currentCellLabel || "A1",
      updatedAt: Date.now()
    }).catch(() => {});
  }

  function listenPresence() {
    presenceUnsubscribe = onSnapshot(collection(db, "presence"), (snapshot) => {
      let editingUsers = [];
      const now = Date.now();
      snapshot.forEach(docSnap => {
        if (docSnap.id !== clientSessionId) {
          const data = docSnap.data();
          if (now - data.updatedAt < 60000) {
            editingUsers.push(`${data.name}[${data.sheet}:${data.cell || 'A1'}]`);
          }
        }
      });
      const badge = document.getElementById("concurrent-users");
      if (editingUsers.length > 0) {
        badge.innerText = `👥 실시간 공동 작업 중: ${editingUsers.join(', ')}`;
        badge.style.display = "inline-block";
      } else {
        badge.style.display = "none";
      }
    });
  }

  // ==================== 관리자 계정 관리 (발급 / PW 직접 변경 / 완전 삭제) ====================
  document.getElementById('btn-show-admin').addEventListener('click', () => {
    document.getElementById('admin-modal').style.display = 'flex';
    loadUserList();
  });
  document.getElementById('btn-close-admin').addEventListener('click', () => {
    document.getElementById('admin-modal').style.display = 'none';
  });

  document.getElementById('tab-list').addEventListener('click', () => {
    document.getElementById('tab-list').classList.add('active');
    document.getElementById('tab-create').classList.remove('active');
    document.getElementById('view-list').classList.add('active');
    document.getElementById('view-create').classList.remove('active');
    loadUserList();
  });

  document.getElementById('tab-create').addEventListener('click', () => {
    document.getElementById('tab-create').classList.add('active');
    document.getElementById('tab-list').classList.remove('active');
    document.getElementById('view-create').classList.add('active');
    document.getElementById('view-list').classList.remove('active');
  });

  document.getElementById('btn-create-user').addEventListener('click', async () => {
    const rawId = document.getElementById('new-id').value.trim();
    const id = rawId.includes('@') ? rawId.split('@')[0] : rawId;
    const pw = document.getElementById('new-pw').value;
    const name = document.getElementById('new-name').value.trim();
    const dept = document.getElementById('new-dept').value.trim();
    const role = document.getElementById('new-role').value;

    if (!id || !pw || !name || !dept) return alert("모든 항목을 입력하세요.");
    if (pw.length < 6) return alert("비밀번호는 6자리 이상이어야 합니다.");

    const email = id + domain;
    try {
      const userCred = await createUserWithEmailAndPassword(secondaryAuth, email, pw);
      await setDoc(doc(db, "users", userCred.user.uid), {
        id: id,
        email: email,
        name: name,
        dept: dept,
        role: role,
        pw: pw,
        createdAt: Date.now()
      });
      await signOut(secondaryAuth);

      alert(`[${name}] 님의 계정이 정상 발급되었습니다.`);
      document.getElementById('new-id').value = '';
      document.getElementById('new-pw').value = '';
      document.getElementById('new-name').value = '';
      document.getElementById('new-dept').value = '';
      document.getElementById('tab-list').click();
    } catch (error) {
      alert("계정 발급 실패: " + error.message);
    }
  });

  async function loadUserList() {
    const tbody = document.getElementById('user-list-body');
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">사용자 목록을 불러오는 중...</td></tr>';

    try {
      const querySnapshot = await getDocs(collection(db, "users"));
      tbody.innerHTML = '';

      querySnapshot.forEach((docSnap) => {
        const uid = docSnap.id;
        const data = docSnap.data();
        const emailStr = data.email || (data.id ? data.id + domain : '이메일 미등록');
        const idOnly = emailStr.includes('@') ? emailStr.split('@')[0] : emailStr;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><b>${idOnly}</b><br><span style="font-size:11px;color:#888;">${emailStr}</span></td>
          <td><b>${data.name || '-'}</b><br><span style="font-size:12px;color:#666;">${data.dept || '-'}</span></td>
          <td><span class="role-badge ${data.role === 'admin' ? 'role-admin' : 'role-user'}">${data.role === 'admin' ? '관리자' : '사용자'}</span></td>
          <td>
            <div class="action-buttons">
              <button class="small-btn change-pw-btn" data-uid="${uid}">PW 직접변경</button>
              <button class="small-btn danger-btn delete-user-btn" data-uid="${uid}">계정 삭제</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);

        tr.querySelector('.change-pw-btn').addEventListener('click', async () => {
          const newPw = prompt(`[${data.name}] 사용자의 새로운 비밀번호를 입력하세요 (6자리 이상):`);
          if (!newPw) return;
          if (newPw.length < 6) return alert("비밀번호는 최소 6자리 이상이어야 합니다.");

          try {
            if (uid === currentUserInfo.uid && auth.currentUser) {
              await updatePassword(auth.currentUser, newPw);
              await setDoc(doc(db, "users", uid), { pw: newPw }, { merge: true });
              alert("관리자 본인의 비밀번호가 즉시 변경되었습니다.");
            } else if (data.email && data.pw) {
              const cred = await signInWithEmailAndPassword(secondaryAuth, data.email, data.pw);
              await updatePassword(cred.user, newPw);
              await setDoc(doc(db, "users", uid), { pw: newPw }, { merge: true });
              await signOut(secondaryAuth);
              alert(`[${data.name}] 님의 비밀번호가 [${newPw}]로 즉시 변경되었습니다.`);
            } else {
              alert("이 계정은 이전 버전에서 생성되어 초기 암호 정보가 DB에 없습니다. 해당 사용자가 1회 로그인하면 이후부터 관리자 직접 변경이 활성화됩니다.");
            }
          } catch (err) {
            alert("비밀번호 변경 오류: " + err.message);
          }
        });

        tr.querySelector('.delete-user-btn').addEventListener('click', async () => {
          if (uid === currentUserInfo.uid) {
            return alert("현재 로그인 중인 관리자 본인의 계정은 삭제할 수 없습니다.");
          }
          if (!confirm(`[${data.name} (${idOnly})] 계정을 완전히 삭제하시겠습니까?`)) return;

          try {
            if (data.email && data.pw) {
              try {
                const cred = await signInWithEmailAndPassword(secondaryAuth, data.email, data.pw);
                await deleteUser(cred.user);
              } catch (authErr) {
                console.warn("Auth 계정 삭제 건너뜀:", authErr);
              }
            }
            await deleteDoc(doc(db, "users", uid));
            alert(`[${data.name}] 계정이 완전히 삭제되었습니다.`);
            loadUserList();
          } catch (err) {
            alert("계정 삭제 실패: " + err.message);
          }
        });
      });
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:red;">목록 로드 실패: ${err.message}</td></tr>`;
    }
  }
</script>
